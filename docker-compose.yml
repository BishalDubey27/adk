version: '3.8'

services:
  # PostgreSQL + pgvector Database (for local development)
  # Uses pgvector image to support CREATE EXTENSION vector
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: sarathi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sarathi"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend API
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      GOOGLE_CLOUD_PROJECT: nirman-project-493414
      GOOGLE_CLOUD_REGION: asia-south1
      ALLOYDB_HOST: db
      ALLOYDB_DATABASE: sarathi
      ALLOYDB_USER: postgres
      ALLOYDB_PASSWORD: postgres
      ALLOYDB_PORT: 5432
      ALLOYDB_USE_CONNECTOR: "false"
      GEMINI_MODEL: gemini-2.0-flash
      VERTEX_AI_EMBEDDING_MODEL: text-embedding-004
      VERTEX_AI_EMBEDDING_DIMENSIONS: 768
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
